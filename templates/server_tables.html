<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Table Comparison - {{ server_name }}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: { DEFAULT: "#1E40AF", hover: "#1D4ED8" },
                        accent: { DEFAULT: "#16A34A", hover: "#15803D" },
                        danger: { DEFAULT: "#DC2626", hover: "#B91C1C" },
                        warning: { DEFAULT: "#D97706", hover: "#B45309" },
                        "background-light": "#F8FAFC",
                        "background-dark": "#0F172A",
                        "surface-light": "#FFFFFF",
                        "surface-dark": "#1E293B",
                        "text-light": "#0F172A",
                        "text-dark": "#E2E8F0",
                        "subtext-light": "#64748B",
                        "subtext-dark": "#94A3B8",
                        "border-light": "#E2E8F0",
                        "border-dark": "#334155",
                    },
                    fontFamily: { display: ["Inter", "sans-serif"] },
                },
            },
        };
    </script>
    <style>
        .material-icons { font-size: 20px; }
        .spinner {
            width: 16px;
            height: 16px;
            display: inline-block;
            vertical-align: middle;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.35);
            border-top-color: currentColor;
            animation: spin 0.9s linear infinite;
            margin-right: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .animate-spin {
            animation: spin 1s linear infinite;
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-text-light dark:text-text-dark">
    <div class="flex h-screen">
        <!-- Sidebar -->
        {% include 'sidebar.html' %}

        <!-- Main Content -->
        <main class="flex-1 ml-64 p-8 overflow-y-auto">
            <!-- Header -->
            <div class="flex justify-between items-center mb-8">
                <div class="flex items-center gap-4">
                    <span class="material-icons text-4xl text-primary">compare</span>
                    <div>
                        <h1 class="text-3xl font-bold">Table Comparison - {{ server_name }}</h1>
                        <p class="text-subtext-light dark:text-subtext-dark mt-1">
                            Comparing tables between SQL Server and PostgreSQL
                        </p>
                    </div>
                </div>
                <div class="flex gap-4 items-center">
                    <a href="{{ url_for('sync_summary.index') }}" 
                       class="flex items-center gap-2 px-5 py-2.5 bg-gray-200 dark:bg-gray-700 text-text-light dark:text-text-dark rounded-lg hover:bg-gray-300 dark:hover:bg-gray-600 transition-colors">
                        <span class="material-icons">arrow_back</span>
                        Back to Summary
                    </a>
                    <button onclick="location.reload()" 
                            class="flex items-center gap-2 px-5 py-2.5 bg-primary text-white rounded-lg hover:bg-primary-hover transition-colors">
                        <span class="material-icons">refresh</span>
                        Refresh
                    </button>
                </div>
            </div>

            <!-- Controls -->
            <div class="bg-surface-light dark:bg-surface-dark rounded-xl shadow-md border border-border-light dark:border-border-dark p-6 mb-6">
                <div class="flex flex-wrap gap-4 justify-between items-center">
                    <div class="flex gap-2">
                        <button onclick="sortTables('name')" 
                                class="px-4 py-2 text-sm bg-gray-100 dark:bg-gray-700 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-600 transition-colors">
                            Sort by Name
                        </button>
                        <button onclick="sortTables('difference')" 
                                class="px-4 py-2 text-sm bg-gray-100 dark:bg-gray-700 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-600 transition-colors">
                            Sort by Difference
                        </button>
                    </div>
                    <div class="flex items-center gap-4">
                        <label class="text-sm text-subtext-light dark:text-subtext-dark">Rows per page:</label>
                        <select id="pageSize" onchange="changePageSize()" 
                                class="bg-gray-100 dark:bg-gray-700 border-0 rounded-lg text-sm py-2 px-3">
                            <option value="10">10</option>
                            <option value="25" selected>25</option>
                            <option value="50">50</option>
                            <option value="100">100</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Table -->
            <div class="bg-surface-light dark:bg-surface-dark rounded-xl shadow-md border border-border-light dark:border-border-dark overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full">
                        <thead class="bg-gray-50 dark:bg-gray-800">
                            <tr>
                                <th class="px-6 py-4 text-left font-semibold">Table Name</th>
                                <th class="px-6 py-4 text-right font-semibold">SQL Server Rows</th>
                                <th class="px-6 py-4 text-right font-semibold">PostgreSQL Rows</th>
                                <th class="px-6 py-4 text-right font-semibold">Difference</th>
                                <th class="px-6 py-4 text-center font-semibold">Status</th>
                            </tr>
                        </thead>
                        <tbody id="tableComparisonBody" class="divide-y divide-border-light dark:divide-border-dark">
                            <tr>
                                <td colspan="5" class="text-center py-8 text-subtext-light dark:text-subtext-dark">
                                    Loading table data...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Pagination -->
                <div class="flex items-center justify-between px-6 py-4 border-t border-border-light dark:border-border-dark">
                    <div class="flex items-center gap-2">
                        <span class="text-sm text-subtext-light dark:text-subtext-dark" id="tableInfo">
                            Showing <span id="startRange">0</span> to <span id="endRange">0</span> of <span id="totalItems">0</span> tables
                        </span>
                    </div>
                    <div class="flex gap-2" id="pagination"></div>
                </div>
            </div>
        </main>
    </div>

    <script>
        let allTables = [];
        let currentPage = 1;
        let pageSize = 25;
        let currentSort = { field: 'name', asc: true };

        async function loadTableData() {
            const tableBody = document.getElementById('tableComparisonBody');
            try {
                const resp = await fetch(window.location.pathname + '/data.json');
                if (!resp.ok) throw new Error(`HTTP error! status: ${resp.status}`);
                const data = await resp.json();
                
                if (data.error) {
                    tableBody.innerHTML = `<tr><td colspan="5" class="text-center py-8 text-danger">Error: ${data.error}</td></tr>`;
                    return;
                }
                
                allTables = consolidateTables(data.tables);
                renderTables();
                
            } catch(err) {
                tableBody.innerHTML = `<tr><td colspan="5" class="text-center py-8 text-danger">Failed to load table data: ${err}</td></tr>`;
            }
        }
        
        // Build a simplified base table name from backend key
        function toBaseTableName(key) {
            if (!key) return '';
            const parts = String(key).split('.');
            let last = parts[parts.length - 1] || '';
            // If name looks like 'schema_table', drop the schema part when common like dbo/public
            if (last.includes('_')) {
                const [prefix, rest] = last.split('_', 2);
                if (/^(dbo|public)$/i.test(prefix) && rest) {
                    last = rest;
                }
            }
            return last;
        }

        // Canonical mapping for inconsistent naming (frontend-only)
        function canonicalizeBaseName(base) {
            const map = {
                'IceCream': 'IceCream_Flavors',
                'Designer': 'Designer_Sneakers',
                'High': 'High_Heels'
            };
            return map[base] || base;
        }

        // Consolidate rows by canonical table name and compute counts/status.
        // Rules:
        // - Group by canonical name (custom map + drop dbo/public prefix)
        // - Within a group, for each side (SQL/PG) take MAX across duplicates to avoid double counting
        // - This preserves cases where one variant exists only on one side (0+N vs N+0)
        function consolidateTables(rawTables) {
            const map = new Map();
            (rawTables || []).forEach(row => {
                const base = toBaseTableName(row.table_name);
                const canonical = canonicalizeBaseName(base);
                if (!map.has(canonical)) {
                    map.set(canonical, { table_name: canonical, sql_candidates: [], pg_candidates: [] });
                }
                const agg = map.get(canonical);
                agg.sql_candidates.push(Number(row.sql_rows || 0));
                agg.pg_candidates.push(Number(row.pg_rows || 0));
            });

            const rows = Array.from(map.values()).map(r => {
                const sql_rows = Math.max(0, ...r.sql_candidates);
                const pg_rows = Math.max(0, ...r.pg_candidates);
                const difference = pg_rows - sql_rows;
                const status = difference === 0
                    ? '✅ Synced'
                    : (sql_rows === 0 && pg_rows > 0)
                        ? '⚠ Extra in PostgreSQL'
                        : (pg_rows === 0 && sql_rows > 0)
                            ? '⚠ Missing in PostgreSQL'
                            : '⚠ Difference';
                return { table_name: r.table_name, sql_rows, pg_rows, difference, status };
            });
            // Default alphabetical sort
            rows.sort((a, b) => a.table_name.localeCompare(b.table_name));
            return rows;
        }

        function statusBadgeClass(status) {
            if (status === '✅ Synced') return 'bg-green-100 text-green-700 dark:bg-green-900 dark:text-green-300';
            if (status === '⚠ Extra in PostgreSQL') return 'bg-blue-100 text-blue-700 dark:bg-blue-900 dark:text-blue-300';
            if (status === '⚠ Missing in PostgreSQL') return 'bg-orange-100 text-orange-700 dark:bg-orange-900 dark:text-orange-300';
            return 'bg-yellow-100 text-yellow-700 dark:bg-yellow-900 dark:text-yellow-300';
        }

        function renderTables() {
            if (!allTables || allTables.length === 0) {
                document.getElementById('tableComparisonBody').innerHTML = 
                    '<tr><td colspan="5" class="text-center py-8 text-subtext-light dark:text-subtext-dark">No tables found</td></tr>';
                return;
            }

            // Sort tables
            allTables.sort((a, b) => {
                const aVal = currentSort.field === 'name' ? a.table_name : a.difference;
                const bVal = currentSort.field === 'name' ? b.table_name : b.difference;
                if (currentSort.field === 'name') {
                    return currentSort.asc ? aVal.localeCompare(bVal) : bVal.localeCompare(aVal);
                }
                return currentSort.asc ? aVal - bVal : bVal - aVal;
            });
            
            // Calculate pagination
            const start = (currentPage - 1) * pageSize;
            const end = Math.min(start + pageSize, allTables.length);
            const pageTables = allTables.slice(start, end);
            
            // Update table body
            const tableBody = document.getElementById('tableComparisonBody');
            tableBody.innerHTML = pageTables.map(table => `
                <tr class="hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors">
                    <td class="px-6 py-4 font-medium">
                        <span class="font-semibold text-text-light dark:text-text-dark">${table.table_name}</span>
                    </td>
                    <td class="px-6 py-4 text-right font-mono text-text-light dark:text-text-dark">${table.sql_rows.toLocaleString()}</td>
                    <td class="px-6 py-4 text-right font-mono text-text-light dark:text-text-dark">${table.pg_rows.toLocaleString()}</td>
                    <td class="px-6 py-4 text-right font-mono ${table.difference === 0 ? 'text-green-600 dark:text-green-400' : (table.difference > 0 ? 'text-blue-600 dark:text-blue-400' : 'text-red-600 dark:text-red-400')} font-medium">
                        ${table.difference >= 0 ? '+' : ''}${table.difference.toLocaleString()}
                    </td>
                    <td class="px-6 py-4 text-center">
                        <span class="inline-flex items-center px-3 py-1 text-xs font-medium rounded-full ${statusBadgeClass(table.status)}">
                            ${table.status}
                        </span>
                    </td>
                </tr>
            `).join('');
            
            // Update pagination info
            document.getElementById('startRange').textContent = Math.min(start + 1, allTables.length);
            document.getElementById('endRange').textContent = end;
            document.getElementById('totalItems').textContent = allTables.length;
            
            // Render pagination controls
            renderPagination();
        }
        
        function renderPagination() {
            const totalPages = Math.ceil(allTables.length / pageSize);
            const pagination = document.getElementById('pagination');
            
            let html = '';
            
            // Previous button
            html += `
                <button onclick="changePage(${currentPage - 1})" 
                        class="px-4 py-2 rounded-lg ${currentPage === 1 ? 'bg-gray-100 text-gray-400 cursor-not-allowed dark:bg-gray-800' : 'bg-gray-100 hover:bg-gray-200 dark:bg-gray-700 dark:hover:bg-gray-600'} transition-colors"
                        ${currentPage === 1 ? 'disabled' : ''}>
                    Previous
                </button>
            `;
            
            // Page numbers
            for (let i = 1; i <= totalPages; i++) {
                if (i === 1 || i === totalPages || (i >= currentPage - 2 && i <= currentPage + 2)) {
                    html += `
                        <button onclick="changePage(${i})" 
                                class="px-4 py-2 rounded-lg ${currentPage === i ? 'bg-primary text-white' : 'bg-gray-100 hover:bg-gray-200 dark:bg-gray-700 dark:hover:bg-gray-600'} transition-colors">
                            ${i}
                        </button>
                    `;
                } else if (i === currentPage - 3 || i === currentPage + 3) {
                    html += `<span class="px-2 py-2 text-subtext-light dark:text-subtext-dark">...</span>`;
                }
            }
            
            // Next button
            html += `
                <button onclick="changePage(${currentPage + 1})" 
                        class="px-4 py-2 rounded-lg ${currentPage === totalPages ? 'bg-gray-100 text-gray-400 cursor-not-allowed dark:bg-gray-800' : 'bg-gray-100 hover:bg-gray-200 dark:bg-gray-700 dark:hover:bg-gray-600'} transition-colors"
                        ${currentPage === totalPages ? 'disabled' : ''}>
                    Next
                </button>
            `;
            
            pagination.innerHTML = html;
        }
        
        function changePage(page) {
            const totalPages = Math.ceil(allTables.length / pageSize);
            if (page < 1 || page > totalPages) return;
            currentPage = page;
            renderTables();
        }
        
        function changePageSize() {
            pageSize = parseInt(document.getElementById('pageSize').value);
            currentPage = 1;
            renderTables();
        }
        
        function sortTables(field) {
            if (currentSort.field === field) {
                currentSort.asc = !currentSort.asc;
            } else {
                currentSort.field = field;
                currentSort.asc = true;
            }
            renderTables();
        }
        
        // Initialize on page load
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('pageSize').value = pageSize;
            loadTableData();
        });
    </script>
</body>
</html>
