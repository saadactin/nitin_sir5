{% extends 'base.html' %}

{% block title %}Upload CSV to PostgreSQL{% endblock %}
{% block header_title %}Upload CSV to PostgreSQL{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto">
  <div class="bg-white dark:bg-gray-800 rounded-xl shadow-card p-6">
    <h2 class="text-lg font-semibold mb-4">Upload CSV and Load to PostgreSQL</h2>

    <form action="{{ url_for('upload_csv') }}" method="POST" enctype="multipart/form-data" class="space-y-6">
      <div>
        <label class="block mb-1 font-medium">CSV File</label>
        <input type="file" name="csv_file" accept=".csv" class="w-full rounded-md border border-border-light dark:border-border-dark p-2" required />
        <p class="text-xs text-subtext-light dark:text-subtext-dark mt-1">Only .csv files are supported</p>
      </div>

      <div>
        <label class="block mb-1 font-medium">Target PostgreSQL Database</label>
        <select name="pg_database" class="w-full rounded-md border border-border-light dark:border-border-dark p-2" required>
          <option value="">Select target PostgreSQL database</option>
          {% if postgres_dbs %}
            {% for db in postgres_dbs %}
              <option value="{{ db }}">{{ db }}</option>
            {% endfor %}
          {% else %}
            <option value="">No PostgreSQL databases found</option>
          {% endif %}
        </select>
      </div>

      <div class="flex gap-3 pt-2">
        <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700">Run Sync</button>
        <a href="{{ url_for('index') }}" class="px-4 py-2 bg-gray-200 dark:bg-gray-700 rounded-md">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
